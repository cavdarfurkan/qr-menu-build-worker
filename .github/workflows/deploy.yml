name: Deploy Build Worker Images to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push-images:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: astro-builder
            dockerfile: ./container/build_publish/Dockerfile
            context: ./container/build_publish
          - image: unpublish-image
            dockerfile: ./container/unpublish/Dockerfile
            context: ./container/unpublish

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata (tags, labels)
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:${{ steps.meta.outputs.sha_short }}
            ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Output image details for ${{ matrix.image }}
        run: |
          echo "Image pushed to ECR:"
          echo "  - ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:${{ steps.meta.outputs.sha_short }}"
          echo "  - ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}:latest"

  build-and-deploy-binary:
    name: Build and Deploy Worker Binary
    runs-on: ubuntu-latest
    needs: build-and-push-images

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o qr-menu-build-worker -ldflags="-w -s" .
          chmod +x qr-menu-build-worker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload binary to S3
        run: |
          aws s3 cp qr-menu-build-worker s3://qr-menu-artifacts/build-worker/qr-menu-build-worker-${{ github.sha }}
          aws s3 cp qr-menu-build-worker s3://qr-menu-artifacts/build-worker/qr-menu-build-worker-latest

      - name: Upload deployment files to S3
        run: |
          aws s3 cp deployment/deploy.sh s3://qr-menu-artifacts/deployment/deploy.sh
          aws s3 cp deployment/setup-env.sh s3://qr-menu-artifacts/deployment/setup-env.sh
          aws s3 cp deployment/qr-menu-build-worker.service s3://qr-menu-artifacts/deployment/qr-menu-build-worker.service

      - name: Deployment summary
        run: |
          echo "✅ Container images and binary built successfully!"
          echo "📦 Images pushed to ECR:"
          echo "  - astro-builder:latest"
          echo "  - unpublish-image:latest"
          echo "🔧 Binary uploaded to S3:"
          echo "  - s3://qr-menu-artifacts/build-worker/qr-menu-build-worker-latest"
          echo "📄 Deployment files uploaded to S3:"
          echo "  - s3://qr-menu-artifacts/deployment/deploy.sh"
          echo "  - s3://qr-menu-artifacts/deployment/setup-env.sh"
          echo "  - s3://qr-menu-artifacts/deployment/qr-menu-build-worker.service"
          echo ""
          echo "⚠️  Manual step required:"
          echo "SSH to EC2 worker instance and run the deployment script to install the binary and configure systemd."
